[project]
name = "karuta"
version = "0.0.0"
description = "API FastAPI de Karuta : catalogue, offres et historique des prix."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2",
    "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/karuta"]
