# « pre-commit install » installe les deux types de hooks sans drapeau : la commande documentée
# dans le README de backend/api ne change pas. Elle doit en revanche être rejouée une fois par
# clone existant, .git/hooks/ n'étant pas versionné.
default_install_hook_types: [pre-commit, commit-msg]

# Aucun hook ci-dessous ne déclare stages: ; sans cette ligne ils hériteraient de « tous les
# stades » et seraient éligibles au stade commit-msg. Gitleaks, seul hook sans filtre de
# fichiers, y tournerait une seconde fois à chaque commit, sur le même diff indexé.
default_stages: [pre-commit]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Alignée sur la version de ruff installée dans backend/api : un hook plus récent
    # que le projet signalerait des erreurs que la CI ne verrait pas.
    rev: v0.16.5
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        # pre-commit s'exécute depuis la racine du dépôt, qui ne porte aucun
        # pyproject.toml : sans --directory, uv ne trouve pas le projet à typer.
        entry: uv run --directory backend/api mypy .
        language: system
        files: ^backend/api/
        pass_filenames: false
      - id: eslint
        name: eslint
        # ESLint vit dans le workspace pnpm de la racine, pas dans un environnement
        # que pre-commit sait construire lui-même : d'où language: system.
        entry: pnpm lint:fix
        language: system
        files: \.(ts|tsx)$
      - id: commitlint
        name: commitlint
        # Comme ESLint, commitlint vit dans le workspace pnpm de la racine : d'où
        # language: system. pre-commit ajoute le chemin du message en argument, que --edit
        # consomme ; lui seul fait écarter les lignes de commentaire de git et la zone de
        # « git commit -v », qui seraient sinon lues comme du corps de message.
        entry: pnpm exec commitlint --edit
        language: system
        stages: [commit-msg]
