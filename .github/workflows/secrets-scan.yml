# Contrôle transverse du doc 09 §4 : un secret peut être commité dans n'importe quel fichier, donc
# ce job ne dépend d'aucun chemin. D'où l'absence d'étape de filtrage — ADR-0022 est satisfait par
# construction, comme pour commit-lint, et non par un filtre qui rendrait toujours run=true.
name: Secrets Scan

on:
  pull_request:
  push: { branches: [main] }

# Le job télécharge puis exécute un binaire tiers dans un dépôt public, dont les journaux
# d'exécution sont lisibles sans compte : le jeton n'a aucune raison d'y être en écriture.
permissions:
  contents: read

jobs:
  # Nom fixé par le tableau « Contrôles transverses » du doc 09 §4, et destiné à devenir un check
  # requis dans la protection de main : le renommer casse la protection sans avertissement.
  secrets-scan:
    runs-on: ubuntu-latest
    # Sans plafond, un curl bloqué sur le CDN retiendrait le job jusqu'aux six heures par défaut,
    # pendant lesquelles la pull request reste infusionnable.
    timeout-minutes: 10
    env:
      # Doit rester égale au « rev: » de .pre-commit-config.yaml ; check-secrets-scan.sh échoue
      # sinon. Deux versions de Gitleaks, ce sont deux jeux de règles, donc un vert local qui ne
      # préjuge plus de la CI — le faux vert que la parité du doc 19 §6 vise à fermer.
      GITLEAKS_VERSION: "8.30.1"
      # Relevé sur gitleaks_8.30.1_checksums.txt de la release. L'archive est vérifiée avant que
      # le binaire ne soit exécuté : c'est le seul contrôle qui distingue la release attendue
      # d'un artefact substitué.
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
      # L'archive linux_x64 suppose l'architecture du runner ubuntu-latest ; changer de runner
      # impose de changer cette ligne et l'empreinte ci-dessus.
      GITLEAKS_ARCHIVE: gitleaks_8.30.1_linux_x64.tar.gz
    steps:
      # fetch-depth: 0 porte ici une correction et non un confort : sur un clone superficiel,
      # « gitleaks git » ne lit qu'un seul commit, ne trouve rien et sort en 0. persist-credentials
      # écrirait le jeton du runner dans .git/config, que le scanner finirait par remonter.
      - uses: actions/checkout@v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }

      - name: Installer Gitleaks
        run: |
          # --fail : sans lui, une réponse 404 est écrite telle quelle dans l'archive et l'erreur
          # ressort de tar, avec un message sans rapport avec sa cause.
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --retry 3 \
            --output "$GITLEAKS_ARCHIVE" \
            "https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION/$GITLEAKS_ARCHIVE"
          # Deux espaces entre l'empreinte et le nom : le format qu'exige sha256sum, qui refuse
          # la ligne autrement.
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$GITLEAKS_ARCHIVE" | sha256sum --check --strict -
          tar -xzf "$GITLEAKS_ARCHIVE" gitleaks
          ./gitleaks version

      # Un scanner qui ne trouve rien est indiscernable d'un scanner qui n'a rien lu : cette étape
      # prouve qu'il détecte, avant que le silence de la suivante ne soit interprété. Même script
      # qu'en local, où « make lint » n'en exécute que le volet parité de version (doc 19 §6).
      - name: Sentinelle du scanner
        env:
          GITLEAKS: ./gitleaks
        run: bash scripts/check-secrets-scan.sh

      - name: Détection de secrets
        run: |
          # Seconde garde contre le clone superficiel : checkout ne signale rien s'il en produit
          # un, et gitleaks non plus.
          test "$(git rev-parse --is-shallow-repository)" = false
          # Historique complet plutôt qu'une plage de commits. Sur une pull request, HEAD est le
          # commit de fusion, dont l'historique couvre main et la branche : le périmètre voulu,
          # sans calcul. Une plage, elle, ne voit que les patchs — un secret logé dans un fichier
          # que la pull request ne touche pas lui échappe, et un force-push en retire le commit
          # fautif alors que GitHub conserve refs/pull/N/head.
          # --redact : les journaux de ce dépôt public sont lisibles sans compte, un secret
          # détecté n'y sera pas recopié en clair. --exit-code n'est pas passé : il ne déclenche
          # pas l'échec, il en choisit la valeur, et --exit-code 0 éteindrait le contrôle.
          ./gitleaks git --redact --no-banner .
