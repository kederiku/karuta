# Déclenchement systématique, filtrage à l'intérieur du job (ADR-0022) : un workflow non
# déclenché ne rapporte aucun statut, et le check requis de la protection de main resterait
# indéfiniment en attente sur une pull request qui ne touche pas le backend.
name: CI Backend
on:
  pull_request:
  push: { branches: [main] }
jobs:
  quality:
    # Ce nom est le check requis déclaré dans la protection de main : le renommer casse la
    # protection sans avertissement (ADR-0022).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: test, POSTGRES_DB: karuta_test, POSTGRES_USER: test }
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-retries 10
        ports: ["5432:5432"]
      redis:
        image: redis:7
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v7.0.1
        # L'historique complet fournit la base de comparaison de l'étape suivante.
        with: { fetch-depth: 0 }

      # Le filtrage est calculé par git : dorny/paths-filter serait une dépendance externe non
      # autorisée (doc 19 §8) pour un besoin qui tient en quelques lignes de shell. Sur push,
      # aucun filtrage — tout s'exécute sur la branche protégée.
      - name: Détecter les changements backend
        id: changes
        run: |
          # --no-renames force git à montrer aussi le chemin d'origine : sans lui, un fichier
          # sorti de backend/api/ n'apparaîtrait que par sa destination et les étapes seraient
          # sautées à tort. quotePath est désarmé, sans quoi un chemin accentué est cité et
          # l'ancre ^ ne matche plus. Même filtre que ci-frontend (KAR-9).
          paths='^(backend/api/|docker/api/|docker/compose/|\.github/workflows/ci-backend\.yml)'
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          base="origin/${{ github.base_ref }}...HEAD"
          if git -c core.quotePath=false diff --name-only --no-renames "$base" \
            | grep -Eq "$paths"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: astral-sh/setup-uv@v10.0.1
        if: steps.changes.outputs.run == 'true'
        with: { enable-cache: true }

      - run: uv sync --frozen
        if: steps.changes.outputs.run == 'true'
        working-directory: backend/api

      - name: Lint
        if: steps.changes.outputs.run == 'true'
        run: uv run ruff check . && uv run ruff format --check .
        working-directory: backend/api

      - name: Types
        if: steps.changes.outputs.run == 'true'
        run: uv run mypy .
        working-directory: backend/api

      # TODO(KAR-14): l'étape s'active d'elle-même à la création d'alembic.ini ; lui porter
      # alors les variables de connexion à karuta_test, celles que l'étape « Tests » déclare
      # depuis KAR-11.
      - name: Migrations réversibles
        if: >-
          steps.changes.outputs.run == 'true'
          && hashFiles('backend/api/alembic.ini') != ''
        run: >-
          uv run alembic upgrade head
          && uv run alembic downgrade base
          && uv run alembic upgrade head
        working-directory: backend/api

      # Depuis KAR-11, l'import de karuta.main construit Settings, qui refuse de démarrer sans
      # ses variables : sans ce bloc, la collecte échouerait avant le premier test. Les valeurs
      # de connexion reprennent les services déclarés au niveau du job ; les secrets sont
      # manifestement factices, aucun secret réel n'entrant en CI (doc 09 §6) — GitHub Actions
      # Secrets n'a rien à porter ici.
      - name: Tests
        if: steps.changes.outputs.run == 'true'
        env:
          ENVIRONMENT: development
          SECRET_KEY: valeur-factice-de-ci
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: karuta_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          S3_ACCESS_KEY: valeur-factice-de-ci
          S3_SECRET_KEY: valeur-factice-de-ci
          INGEST_HMAC_SECRET: valeur-factice-de-ci
        run: uv run pytest --cov=karuta --cov-report=xml --cov-fail-under=75
        working-directory: backend/api

      # TODO(KAR-87): l'étape s'active d'elle-même à la création de la référence de
      # non-régression, que ce ticket commite avec les deux scripts du doc 15 §9.
      - name: Matching — non-régression
        if: >-
          steps.changes.outputs.run == 'true'
          && hashFiles('backend/api/.matching-baseline.json') != ''
        run: >-
          uv run python -m scripts.evaluate_matching --set golden --json > metrics.json
          && uv run python -m scripts.check_regression metrics.json
          --baseline .matching-baseline.json
        working-directory: backend/api
